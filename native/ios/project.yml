# Tạo dự án Xcode bằng XcodeGen:  brew install xcodegen  &&  cd native/ios  &&  xcodegen
name: EduShield
options:
  bundleIdPrefix: vn.edushield
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: ""          # điền Team ID (tài khoản Apple miễn phí cũng được) trong Xcode
targets:
  EduShield:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared/Swift
      - path: Shared/js
        buildPhase: resources
      - path: Shared/drill
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: EduShield
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/EduShield.entitlements
      properties:
        com.apple.security.application-groups: [group.vn.edushield.app]
    dependencies:
      - target: EduShieldShare
      - target: EduShieldKeyboard
  EduShieldShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared/Swift
      - path: Shared/js
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: EduShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/EduShieldShare.entitlements
      properties:
        com.apple.security.application-groups: [group.vn.edushield.app]
  EduShieldKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared/Swift
      - path: Shared/js
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: EduShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: vi-VN
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/EduShieldKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.vn.edushield.app]
