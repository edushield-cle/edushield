plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.edushield.app'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.edushield.app'
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName '1.8.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Đọc chữ trong ảnh chụp màn hình NGAY TRÊN MÁY (mô hình chữ Latin, hỗ trợ tiếng Việt, đóng gói sẵn trong app)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
