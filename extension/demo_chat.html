<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lớp 11A - Nhóm chat (mô phỏng)</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#e9ebee}
  .app{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:#fff}
  .top{padding:12px 16px;border-bottom:1px solid #ddd;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  .top small{font-weight:400;color:#888}
  .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px;align-items:flex-end}
  .row.me{flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .who{font-size:11.5px;color:#888;margin:0 0 2px 4px}
  .bubble{background:#f0f2f5;border-radius:16px;padding:8px 12px;max-width:420px;line-height:1.4}
  .me .bubble{background:#0084ff;color:#fff}
  .bubble a{color:#0a58ca}
  .bar{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd}
  .box{flex:1;border:1px solid #ccc;border-radius:18px;padding:8px 12px;min-height:20px;outline:none}
  .ctrl{padding:8px 14px;border-top:1px solid #eee;background:#fafafa;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="top">Lớp 11A 💬 <small>Trang mô phỏng để demo EduShield, không phải mạng xã hội thật</small></div>
  <div class="msgs" id="msgs"></div>
  <div class="bar"><div class="box" contenteditable="true" data-placeholder="Aa"></div><button id="sendBtn">Gửi</button></div>
  <div class="ctrl">
    <button id="next">Tin nhắn tiếp theo ▶</button>
    <label><input type="checkbox" id="auto"> Tự động (4 giây/tin)</label>
    <span id="count"></span>
  </div>
</div>
<script>
const SCRIPT = [
  ["Linh", "#e67e22", "Mai kiểm tra toán đấy, mọi người ôn chương 3 nhé"],
  ["Minh", "#16a085", "haha thằng quỷ Khoa lại quên trả sách cho tao rồi"],
  ["Cô Hà (GVCN)", "#8e44ad", 'Cô gửi link bài tập: <a href="https://thptmophong.edu.vn/baitap" target="_blank">thptmophong.edu.vn/baitap</a>, các em nộp trước thứ 6'],
  ["Shop Tuyển Dụng", "#7f8c8d", "Tuyển CTV chốt đơn tại nhà 500k/ngày, không cần cọc, ib zalo 0912345678"],
  ["Quân", "#c0392b", "mày mà mách cô thì đừng trách tao, tan học tao chờ ở cổng"],
  ["Ngọc", "#2980b9", 'xem cái này đi <a href="https://{{DEMO_DOMAIN}}/nhan" target="_blank">{{DEMO_DOMAIN}}/nhan</a>'],
  ["Cô Hà (số mới)", "#8e44ad", "Cô đang họp, em chuyển gấp 500k tiền quỹ lớp vào stk 190355667788 giúp cô nhé"],
  ["Trang", "#d35400", "Chúc mừng Vy được giải nhất môn văn nha, giỏi quá"],
  ["Ẩn danh", "#34495e", "cả lớp ơi đừng chơi với con Vy nữa, nó hay ăn cắp vặt"],
  ["Phúc", "#27ae60", "tối nay call nhóm làm thuyết trình sử lúc 8h nha"],
];
let i = 0, timer = null;
const msgs = document.getElementById("msgs");
function addMsg(who, color, html, me) {
  const row = document.createElement("div");
  row.className = "row" + (me ? " me" : "");
  row.innerHTML = (me ? "" : `<div class="av" style="background:${color}">${who[0]}</div>`) +
    `<div>${me ? "" : `<div class="who">${who}</div>`}<div class="bubble" dir="auto">${html}</div></div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}
function next() {
  if (i >= SCRIPT.length) { stopAuto(); return; }
  const [w, c, h] = SCRIPT[i++];
  addMsg(w, c, h);
  document.getElementById("count").textContent = `${i}/${SCRIPT.length}`;
}
function stopAuto() { clearInterval(timer); timer = null; document.getElementById("auto").checked = false; }
document.getElementById("next").onclick = next;
document.getElementById("auto").onchange = (e) => { if (e.target.checked) { next(); timer = setInterval(next, 4000); } else stopAuto(); };
const box = document.querySelector(".box");
document.getElementById("sendBtn").onclick = () => {
  const t = box.innerText.trim(); if (!t) return;
  const d = document.createElement("div"); d.textContent = t;
  addMsg("Bạn", "#0084ff", d.innerHTML, true); box.innerText = "";
};
next();
</script>
</body>
</html>
